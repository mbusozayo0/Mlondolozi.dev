<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">Mlondolozi.dev logo</title>
  <desc id="desc">Primary Mlondolozi.dev logo with MZ monogram and wordmark.</desc>
  <defs>
    <linearGradient id="mark" x1="22" y1="20" x2="134" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="0.48" stop-color="#53e7ff"/>
      <stop offset="1" stop-color="#ffb86c"/>
    </linearGradient>
  </defs>
  <g transform="translate(18 18)">
