    <ellipse cx="72" cy="72" rx="86" ry="55" fill="none" stroke="#245d84" stroke-width="1.8" opacity="0.48" transform="rotate(28 72 72)"/>
    <rect x="14" y="14" width="116" height="116" rx="20" fill="url(#mark)"/>
    <text x="72" y="89" text-anchor="middle" fill="#061018" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="0">MZ</text>
