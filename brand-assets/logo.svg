    <text x="0" y="74" fill="#f4f8fb" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="0">Mlondolozi Zondi</text>
    <text x="2" y="106" fill="#9fb4c8" font-family="JetBrains Mono, Consolas, monospace" font-size="16" font-weight="500">Mlondolozi.dev</text>
